<!DOCTYPE html>
<html lang="vi">
<head>
    <title>Đổi Mật Khẩu Bắt Buộc</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="login-wrapper">
        <div class="login-box" style="border-top: 5px solid #FF6B6B;">
            <h3><i class="fas fa-key"></i> Đổi Mật Khẩu</h3>
            
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}{% for cat, msg in messages %}<div class="alert alert-{{ cat }}">{{ msg }}</div>{% endfor %}{% endif %}
            {% endwith %}

            <div class="alert alert-warning" style="text-align: left; font-size: 13px;">
                <i class="fas fa-exclamation-circle"></i> Đây là lần đăng nhập đầu tiên. Vui lòng đổi mật khẩu mặc định để tiếp tục.
            </div>
            
            <form method="POST">
                <input type="password" name="new_password" placeholder="Mật khẩu mới" required>
                <input type="password" name="confirm_password" placeholder="Nhập lại mật khẩu mới" required>
                
                <button type="submit" class="btn">
                    <i class="fas fa-save"></i> Cập nhật & Đăng nhập
                </button>
            </form>
            
            <div class="links">
                <a href="/logout">Đăng xuất</a>
            </div>
        </div>
    </div>
</body>
</html>
