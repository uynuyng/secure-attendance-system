<!DOCTYPE html>
<html lang="vi">
<head><title>Đặt Mật Khẩu Mới</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body>
    <div class="login-wrapper">
        <div class="login-box">
            <h3>Đặt Mật Khẩu Mới</h3>
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}{% for cat, msg in messages %}<div class="alert alert-{{ cat }}">{{ msg }}</div>{% endfor %}{% endif %}
            {% endwith %}
            <form method="POST">
                <input type="password" name="new_password" placeholder="Mật khẩu mới" required>
                <input type="password" name="confirm_password" placeholder="Nhập lại mật khẩu mới" required>
                <button type="submit" class="btn">Đổi Mật Khẩu</button>
            </form>
        </div>
    </div>
</body></html>
