<!DOCTYPE html>
<html lang="vi">
<head><title>Quên mật khẩu</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body>
    <div class="login-wrapper">
        <div class="login-box">
            <h2>Khôi Phục Mật Khẩu</h2>
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}{% for cat, msg in messages %}<div class="alert alert-{{ cat }}">{{ msg }}</div>{% endfor %}{% endif %}
            {% endwith %}
            <form method="POST">
                <input type="email" name="email" placeholder="Nhập Email của bạn" required>
                <button type="submit" class="btn">Gửi mã xác nhận</button>
            </form>
            <div class="links"><a href="/login">Quay lại</a></div>
        </div>
    </div>
</body></html>
